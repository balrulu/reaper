name: Build ReaPack index

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reapack-index-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reapack-index:
    runs-on: ubuntu-latest

    steps:
      - name: Fetch repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Install Pandoc
        run: sudo apt-get install -yy pandoc

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"

      - name: Install reapack-index
        run: gem install reapack-index

      - name: Validate packages
        run: reapack-index --check

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update index.xml
        run: |
          BEFORE_SHA="$(git rev-parse HEAD)"
          reapack-index --commit
          AFTER_SHA="$(git rev-parse HEAD)"

          ruby <<'RUBY'
          require "nokogiri"
          require "metaheader"

          path = "index.xml"
          doc = Nokogiri::XML(File.read(path))
          desc_changed = 0
          old_versions_removed = 0

          doc.xpath("/index/category").each do |category|
            category_name = category["name"]

            category.xpath("./reapack[@type='langpack']").each do |package|
              langpack_path = File.join(category_name, package["name"])
              next unless File.file?(langpack_path)

              header = MetaHeader.from_file(langpack_path)
              description = header[:description] || header[:desc]
              next if description.nil? || description.to_s.empty?
              next if package["desc"] == description

              package["desc"] = description
              desc_changed += 1
            end

            category.xpath("./reapack").each do |package|
              versions = package.xpath("./version")
              next if versions.length <= 1

              versions[0...-1].each do |version|
                version.remove
                old_versions_removed += 1
              end
            end
          end

          File.write(path, doc.to_xml)

          puts "Updated #{desc_changed} LangPack description(s) from @description"
          puts "Removed #{old_versions_removed} old package version(s)"
          RUBY

          git add index.xml

          if ! git diff --cached --quiet; then
            if [ "$BEFORE_SHA" != "$AFTER_SHA" ]; then
              git commit --amend --no-edit
            else
              git commit -m "index: normalize package metadata" -m "[ci skip]"
            fi
          fi

      - name: Push index.xml
        run: git push
